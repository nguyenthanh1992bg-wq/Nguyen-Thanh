ùng với I, you, we, they hoặc số nhiều.',having:'Không dùng "having" đơn lẻ ở đây.',haves:'Không có dạng "haves".'},['"The dog" là một con hay nhiều con?',"Một con vật = it. It → ?"],{...L,assesses:"has với danh từ số ít"}),E("ls-have-q1","U08",1,"They ___ a big house.",["have","has","is","are"],"have","They đi với have.",{has:'"has" chỉ dùng với he, she, it.',is:'"is" là của to be.',are:'"are" là của to be, không có nghĩa "có".'},["Chủ ngữ là They.","They → have hay has?"],{...L,assesses:"have với they"}),pt("ls-have-q2","U08",1,"My brother ___ a new phone. (have / has)",["has"],'"My brother" thay bằng he nên dùng has.',{have:'"have" dùng với I, you, we, they.'},['"My brother" thay bằng đại từ nào?',"He → ?"],{...L,assesses:"has với danh từ số ít"}),E("ls-have-q3","U08",2,"Nam and Minh ___ a football.",["has","have","is","are"],"have","Nam và Minh là hai người, thay bằng they nên dùng have.",{has:"Có hai người nên không dùng has.",is:'"is" là của to be.',are:'"are" là của to be, không có nghĩa "có".'},['"Nam and Minh" là mấy người?',"Hai người = they → ?"],{...L,assesses:"have với chủ ngữ ghép"}),E("ls-have-r1","U08",1,"The table ___ four legs.",["have","has","having","haves"],"has",'"The table" là một cái bàn, thay bằng it nên dùng has.',{have:"Chủ ngữ số ít nên không dùng have.",having:'Không dùng "having" đơn lẻ ở đây.',haves:'Không có dạng "haves".'},["Có một cái bàn. Thay bằng it.","It → have hay has?"],{...L,assesses:"has với vật"}),E("ls-there-g1","U09",1,"There ___ a clock on the wall.",["is","are","am","be"],"is",'"a clock" là số ít nên dùng There is.',{are:'"are" dùng với số nhiều.',am:'"am" chỉ đi với I.',be:"Cần dạng chia."},['Sau chỗ trống là "a clock" – một cái.',"Số ít → is hay are?"],{...L,assesses:"There is"}),E("ls-there-p1","U09",1,"There ___ five chairs in the room.",["is","are","am","be"],"are",'"five chairs" là số nhiều nên dùng There are.',{is:'"is" dùng với số ít.',am:'"am" chỉ đi với I.',be:"Cần dạng chia."},["Đếm: five chairs là mấy cái?","Số nhiều → is hay are?"],{...L,assesses:"There are"}),E("ls-there-p2","U09",1,"___ there a library in your school?",["Is","Are","Do","Does"],"Is",'"a library" là số ít nên câu hỏi bắt đầu bằng Is there…?',{Are:'"Are there…?" dùng với số nhiều.',Do:"Câu hỏi với there dùng is/are, không dùng do.",Does:"Câu hỏi với there dùng is/are, không dùng does."},["Câu hỏi với There dùng to be.",'"a library" là một – Is hay Are?'],{...L,assesses:"Is there…?"}),E("ls-there-q1","U09",1,"There ___ two books on my desk.",["is","are","am","be"],"are",'"two books" là số nhiều nên dùng There are.',{is:'"is" dùng với số ít.',am:'"am" chỉ đi với I.',be:"Cần dạng chia."},["two books là mấy quyển?","Số nhiều → ?"],{...L,assesses:"There are"}),La("ls-there-q2","U09",2,"Put the words in the correct order.",["garden","a","There","the","dog","in","is"],["There is a dog in the garden"],"There is + a/an + danh từ số ít + giới từ chỉ nơi chốn.",{"a dog is There in the garden":"Câu bắt đầu bằng There rồi mới đến is."},['Bắt đầu bằng "There is".','Sau đó là "a dog", rồi nơi chốn "in the garden".'],{...L,assesses:"Cấu trúc There is"}),E("ls-there-q3","U09",2,"Is there a park near your house? Choose the correct short answer (yes).",["Yes, there is.","Yes, it is.","Yes, there are.","Yes, there does."],"Yes, there is.",'Trả lời ngắn lặp lại "there is": Yes, there is.',{"Yes, it is.":"Câu hỏi là Is there…? nên trả lời lại bằng there.","Yes, there are.":'Câu hỏi có "a park" (số ít) nên dùng is.',"Yes, there does.":"Không dùng does với there."},["Câu hỏi mở đầu bằng Is there…","Trả lời: Yes, there + ?"],{...L,assesses:"Trả lời ngắn với Is there"}),E("ls-there-r1","U09",1,"There ___ ten students in my class.",["is","are","am","be"],"are",'"ten students" là số nhiều nên dùng There are.',{is:'"is" dùng với số ít.',am:'"am" chỉ đi với I.',be:"Cần dạng chia."},["ten students là mấy bạn?","Số nhiều → ?"],{...L,assesses:"There are"}),E("ls-ps-g1","U10",1,"My mother ___ breakfast every morning.",["cook","cooks","cooking","cookes"],"cooks",'"My mother" thay bằng she, động từ thêm -s: cooks.',{cook:"Với he/she/it động từ phải thêm -s.",cooking:'Đây là thói quen "every morning", dùng hiện tại đơn.',cookes:"cook không tận cùng s, x, ch, sh, o nên chỉ thêm -s."},['"My mother" = she. She cần động từ thế nào?',"cook → thêm s hay es?"],{...L,assesses:"V-s với she"}),E("ls-ps-p1","U10",1,"They ___ football on Saturdays.",["play","plays","playing","playes"],"play","They đi với động từ nguyên mẫu: play.",{plays:"Chỉ he/she/it mới thêm -s.",playing:"Đây là thói quen, không dùng V-ing.",playes:"Không có dạng này."},["Chủ ngữ là They.","They: động từ thêm đuôi hay giữ nguyên?"],{...L,assesses:"Động từ nguyên mẫu với they"}),pt("ls-ps-p2","U10",2,"He ___ (study) English every night. Write the correct verb form.",["studies"],"study tận cùng phụ âm + y nên đổi y → ies: studies.",{studys:"Phụ âm + y thì đổi y → ies.",study:"Với he phải thêm đuôi.",studyes:"Phải bỏ y trước khi thêm -es."},["He cần động từ thêm đuôi.","study: chữ trước y là phụ âm → bỏ y, thêm ies."],{...L,assesses:"V-ies"}),E("ls-ps-q1","U10",1,"The sun ___ in the east.",["rise","rises","rising","rised"],"rises",'"The sun" là số ít (it), sự thật hiển nhiên dùng hiện tại đơn: rises.',{rise:"Với he/she/it phải thêm -s.",rising:"Sự thật hiển nhiên dùng hiện tại đơn.",rised:"Không dùng quá khứ ở đây (và dạng quá khứ của rise là rose)."},['"The sun" thay bằng it.',"It → động từ thêm s."],{...L,assesses:"V-s cho sự thật"}),E("ls-ps-q2","U10",1,"I ___ to school by bike.",["go","goes","going","gos"],"go","I đi với động từ nguyên mẫu: go.",{goes:"Chỉ he/she/it mới thêm -es.",going:"Đây là thói quen, không dùng V-ing.",gos:"Không có dạng này."},["Chủ ngữ là I.","I: động từ giữ nguyên."],{...L,assesses:"Động từ nguyên mẫu với I"}),E("ls-ps-q3","U10",2,"Mai ___ her teeth twice a day.",["brush","brushes","brushs","brushing"],"brushes","Mai = she; brush tận cùng sh nên thêm -es: brushes.",{brush:"Với she phải thêm đuôi.",brushs:"Từ tận cùng sh phải thêm -es.",brushing:'Đây là thói quen "twice a day", dùng hiện tại đơn.'},["Mai là bạn nữ → she.","brush tận cùng sh → thêm gì?"],{...L,assesses:"V-es sau sh"}),E("ls-ps-r1","U10",1,"Tom ___ TV after dinner.",["watch","watches","watchs","watching"],"watches","Tom = he; watch tận cùng ch nên thêm -es: watches.",{watch:"Với he phải thêm đuôi.",watchs:"Từ tận cùng ch phải thêm -es.",watching:"Đây là thói quen, không dùng V-ing."},["Tom = he.","watch tận cùng ch → thêm gì?"],{...L,assesses:"V-es sau ch"})],oe=[{id:"lesson-alphabet",unit:"U01",title:"Bảng chữ cái tiếng Anh",minutes:15,objective:"Biết có 26 chữ cái, nhận ra nguyên âm – phụ âm và nắm thứ tự chữ cái.",explain:[{heading:"Bảng chữ cái có 26 chữ",lines:["Tiếng Anh có 26 chữ cái, từ A đến Z.","Cách nhớ: A–M có 13 chữ, N–Z có 13 chữ."]},{heading:"Nguyên âm và phụ âm",lines:["5 chữ là nguyên âm: A, E, I, O, U.","21 chữ còn lại là phụ âm.","Biết nguyên âm sẽ giúp em chọn a hay an ở các bài sau."],table:[["Nhóm","Chữ cái"],["Nguyên âm (5)","A  E  I  O  U"],["Phụ âm (21)","B C D F G H J K L M N P Q R S T V W X Y Z"]]},{heading:"Chữ cái khác với âm",lines:['Cùng một chữ có thể đọc thành những âm khác nhau, ví dụ C trong "cat" và "city".',"Vì vậy em nên học cả cách đọc cả từ, không chỉ học tên chữ cái."]}],examples:[{en:"A, B, C, D, E",vi:"Năm chữ cái đầu tiên, theo đúng thứ tự.",ok:!0},{en:"E is a vowel.",vi:"E là một nguyên âm.",ok:!0},{en:"M is a vowel.",vi:"M là nguyên âm.",ok:!1,note:"Sai: M là phụ âm. Nguyên âm chỉ có A, E, I, O, U."},{en:"There are 25 letters.",vi:"Có 25 chữ cái.",ok:!1,note:"Sai: có 26 chữ cái."}],guided:{questionId:"ls-alpha-g1",steps:["Nhớ lại bảng chữ cái đi từ A đến Z.","Chia đôi: A–M là 13 chữ, N–Z là 13 chữ.","Cộng lại: 13 + 13 = 26."]},practice:["ls-alpha-p1","ls-alpha-p2"],quiz:["ls-alpha-q1","ls-alpha-q2","ls-alpha-q3"],remedial:{simpler:["Chỉ cần nhớ một câu: nguyên âm là A, E, I, O, U (5 chữ).","Chữ nào không nằm trong 5 chữ đó là phụ âm.","Muốn tìm chữ đứng sau/trước, hãy đọc thầm bảng chữ cái từ A."],questionId:"ls-alpha-r1"},vocab:[{id:"v-alphabet",en:"alphabet",vi:"bảng chữ cái",example:"The English alphabet has 26 letters."},{id:"v-letter",en:"letter",vi:"chữ cái",example:"A is the first letter."},{id:"v-vowel",en:"vowel",vi:"nguyên âm",example:"A, E, I, O, U are vowels."},{id:"v-consonant",en:"consonant",vi:"phụ âm",example:"B is a consonant."},{id:"v-spell",en:"spell",vi:"đánh vần",example:"Can you spell your name?"}]},{id:"lesson-tobe",unit:"U03",title:"Tôi là… – am, is, are",minutes:18,objective:"Chọn đúng am / is / are theo chủ ngữ.",explain:[{heading:'To be nghĩa là "là, thì, ở"',lines:["Em dùng to be để nói em là ai, ở đâu, như thế nào: I am happy. She is in the kitchen.","To be có 3 dạng: am, is, are. Dạng nào phụ thuộc vào chủ ngữ."]},{heading:"Bảng ghép chủ ngữ",lines:["Mỗi chủ ngữ chỉ đi với đúng một dạng."],table:[["Chủ ngữ","Dạng to be","Ví dụ"],["I","am","I am Nam."],["He / She / It","is","She is tall."],["You / We / They","are","We are friends."],["Nhiều người/vật","are","The books are new."]]},{heading:"Viết tắt, phủ định và câu hỏi",lines:["Viết tắt: I'm, she's, we're.","Phủ định: thêm not sau be: She is not (isn't) tall.","Câu hỏi: đưa be lên đầu: Is she tall?"]}],examples:[{en:"I am a student.",vi:"Tôi là học sinh.",ok:!0},{en:"She is my friend.",vi:"Bạn ấy là bạn của tôi.",ok:!0},{en:"They are in the classroom.",vi:"Họ ở trong lớp học.",ok:!0},{en:"I is a student.",vi:"Tôi là học sinh.",ok:!1,note:"Sai: I đi với am → I am a student."},{en:"He are tall.",vi:"Cậu ấy cao.",ok:!1,note:"Sai: He đi với is → He is tall."}],guided:{questionId:"ls-tobe-g1",steps:["Tìm chủ ngữ: She.","She là ngôi thứ ba số ít, giống He / It.","He / She / It đi với is."]},practice:["ls-tobe-p1","ls-tobe-p2"],quiz:["ls-tobe-q1","ls-tobe-q2","ls-tobe-q3"],remedial:{simpler:["Chỉ có 3 từ: am, is, are.","I → am (chỉ đi với I).","He, She, It (một người/vật) → is.","You, We, They và số nhiều → are."],questionId:"ls-tobe-r1"},vocab:[{id:"v-student",en:"student",vi:"học sinh",example:"I am a student."},{id:"v-teacher",en:"teacher",vi:"giáo viên",example:"My teacher is kind."},{id:"v-friend",en:"friend",vi:"bạn",example:"She is my friend."},{id:"v-classroom",en:"classroom",vi:"lớp học",example:"We are in the classroom."},{id:"v-happy",en:"happy",vi:"vui",example:"I am happy today."},{id:"v-tall",en:"tall",vi:"cao",example:"He is tall."}]},{id:"lesson-plural",unit:"U04",title:"Một và nhiều – danh từ số nhiều",minutes:18,objective:"Biến danh từ số ít thành số nhiều đúng quy tắc.",explain:[{heading:"Quy tắc chính",lines:["Phần lớn danh từ: thêm -s (book → books).","Tận cùng s, x, ch, sh: thêm -es (bus → buses, watch → watches).","Tận cùng phụ âm + y: đổi y → ies (city → cities).","Tận cùng nguyên âm + y: chỉ thêm s (toy → toys)."]},{heading:"Bảng tóm tắt",lines:[],table:[["Tận cùng","Cách làm","Ví dụ"],["Thường","+ s","pen → pens"],["s, x, ch, sh","+ es","box → boxes"],["phụ âm + y","y → ies","baby → babies"],["nguyên âm + y","+ s","boy → boys"]]},{heading:"Từ bất quy tắc cần thuộc",lines:["child → children, man → men, woman → women, foot → feet, tooth → teeth, person → people."]}],examples:[{en:"two books",vi:"hai quyển sách",ok:!0},{en:"three buses",vi:"ba chiếc xe buýt",ok:!0},{en:"five cities",vi:"năm thành phố",ok:!0},{en:"two childs",vi:"hai đứa trẻ",ok:!1,note:"Sai: child → children."},{en:"three citys",vi:"ba thành phố",ok:!1,note:"Sai: phụ âm + y → bỏ y, thêm ies → cities."}],guided:{questionId:"ls-plural-g1",steps:['Chữ cuối của "bus" là s.',"Tận cùng s → thêm -es.","bus + es = buses."]},practice:["ls-plural-p1","ls-plural-p2"],quiz:["ls-plural-q1","ls-plural-q2","ls-plural-q3"],remedial:{simpler:["Bước 1: nhìn chữ cuối của từ.","Bước 2: nếu là s, x, ch, sh → thêm es.","Bước 3: nếu là phụ âm + y → bỏ y, thêm ies.","Còn lại thường chỉ thêm s. Vài từ đặc biệt (child, man…) phải học thuộc."],questionId:"ls-plural-r1"},vocab:[{id:"v-box",en:"box",vi:"cái hộp",example:"There are two boxes."},{id:"v-bus",
