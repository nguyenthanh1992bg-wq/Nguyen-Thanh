êm đuôi.",brushs:"Từ tận cùng sh phải thêm -es.",brushing:'Đây là thói quen "twice a day", dùng hiện tại đơn.'},["Mai là bạn nữ → she.","brush tận cùng sh → thêm gì?"],{...R,assesses:"V-es sau sh"}),_("ls-ps-r1","U10",1,"Tom ___ TV after dinner.",["watch","watches","watchs","watching"],"watches","Tom = he; watch tận cùng ch nên thêm -es: watches.",{watch:"Với he phải thêm đuôi.",watchs:"Từ tận cùng ch phải thêm -es.",watching:"Đây là thói quen, không dùng V-ing."},["Tom = he.","watch tận cùng ch → thêm gì?"],{...R,assesses:"V-es sau ch"})],oe=[{id:"lesson-alphabet",unit:"U01",title:"Bảng chữ cái tiếng Anh",minutes:15,objective:"Biết có 26 chữ cái, nhận ra nguyên âm – phụ âm và nắm thứ tự chữ cái.",explain:[{heading:"Bảng chữ cái có 26 chữ",lines:["Tiếng Anh có 26 chữ cái, từ A đến Z.","Cách nhớ: A–M có 13 chữ, N–Z có 13 chữ."]},{heading:"Nguyên âm và phụ âm",lines:["5 chữ là nguyên âm: A, E, I, O, U.","21 chữ còn lại là phụ âm.","Biết nguyên âm sẽ giúp em chọn a hay an ở các bài sau."],table:[["Nhóm","Chữ cái"],["Nguyên âm (5)","A  E  I  O  U"],["Phụ âm (21)","B C D F G H J K L M N P Q R S T V W X Y Z"]]},{heading:"Chữ cái khác với âm",lines:['Cùng một chữ có thể đọc thành những âm khác nhau, ví dụ C trong "cat" và "city".',"Vì vậy em nên học cả cách đọc cả từ, không chỉ học tên chữ cái."]}],examples:[{en:"A, B, C, D, E",vi:"Năm chữ cái đầu tiên, theo đúng thứ tự.",ok:!0},{en:"E is a vowel.",vi:"E là một nguyên âm.",ok:!0},{en:"M is a vowel.",vi:"M là nguyên âm.",ok:!1,note:"Sai: M là phụ âm. Nguyên âm chỉ có A, E, I, O, U."},{en:"There are 25 letters.",vi:"Có 25 chữ cái.",ok:!1,note:"Sai: có 26 chữ cái."}],guided:{questionId:"ls-alpha-g1",steps:["Nhớ lại bảng chữ cái đi từ A đến Z.","Chia đôi: A–M là 13 chữ, N–Z là 13 chữ.","Cộng lại: 13 + 13 = 26."]},practice:["ls-alpha-p1","ls-alpha-p2"],quiz:["ls-alpha-q1","ls-alpha-q2","ls-alpha-q3"],remedial:{simpler:["Chỉ cần nhớ một câu: nguyên âm là A, E, I, O, U (5 chữ).","Chữ nào không nằm trong 5 chữ đó là phụ âm.","Muốn tìm chữ đứng sau/trước, hãy đọc thầm bảng chữ cái từ A."],questionId:"ls-alpha-r1"},vocab:[{id:"v-alphabet",en:"alphabet",vi:"bảng chữ cái",example:"The English alphabet has 26 letters."},{id:"v-letter",en:"letter",vi:"chữ cái",example:"A is the first letter."},{id:"v-vowel",en:"vowel",vi:"nguyên âm",example:"A, E, I, O, U are vowels."},{id:"v-consonant",en:"consonant",vi:"phụ âm",example:"B is a consonant."},{id:"v-spell",en:"spell",vi:"đánh vần",example:"Can you spell your name?"}]},{id:"lesson-tobe",unit:"U03",title:"Tôi là… – am, is, are",minutes:18,objective:"Chọn đúng am / is / are theo chủ ngữ.",explain:[{heading:'To be nghĩa là "là, thì, ở"',lines:["Em dùng to be để nói em là ai, ở đâu, như thế nào: I am happy. She is in the kitchen.","To be có 3 dạng: am, is, are. Dạng nào phụ thuộc vào chủ ngữ."]},{heading:"Bảng ghép chủ ngữ",lines:["Mỗi chủ ngữ chỉ đi với đúng một dạng."],table:[["Chủ ngữ","Dạng to be","Ví dụ"],["I","am","I am Nam."],["He / She / It","is","She is tall."],["You / We / They","are","We are friends."],["Nhiều người/vật","are","The books are new."]]},{heading:"Viết tắt, phủ định và câu hỏi",lines:["Viết tắt: I'm, she's, we're.","Phủ định: thêm not sau be: She is not (isn't) tall.","Câu hỏi: đưa be lên đầu: Is she tall?"]}],examples:[{en:"I am a student.",vi:"Tôi là học sinh.",ok:!0},{en:"She is my friend.",vi:"Bạn ấy là bạn của tôi.",ok:!0},{en:"They are in the classroom.",vi:"Họ ở trong lớp học.",ok:!0},{en:"I is a student.",vi:"Tôi là học sinh.",ok:!1,note:"Sai: I đi với am → I am a student."},{en:"He are tall.",vi:"Cậu ấy cao.",ok:!1,note:"Sai: He đi với is → He is tall."}],guided:{questionId:"ls-tobe-g1",steps:["Tìm chủ ngữ: She.","She là ngôi thứ ba số ít, giống He / It.","He / She / It đi với is."]},practice:["ls-tobe-p1","ls-tobe-p2"],quiz:["ls-tobe-q1","ls-tobe-q2","ls-tobe-q3"],remedial:{simpler:["Chỉ có 3 từ: am, is, are.","I → am (chỉ đi với I).","He, She, It (một người/vật) → is.","You, We, They và số nhiều → are."],questionId:"ls-tobe-r1"},vocab:[{id:"v-student",en:"student",vi:"học sinh",example:"I am a student."},{id:"v-teacher",en:"teacher",vi:"giáo viên",example:"My teacher is kind."},{id:"v-friend",en:"friend",vi:"bạn",example:"She is my friend."},{id:"v-classroom",en:"classroom",vi:"lớp học",example:"We are in the classroom."},{id:"v-happy",en:"happy",vi:"vui",example:"I am happy today."},{id:"v-tall",en:"tall",vi:"cao",example:"He is tall."}]},{id:"lesson-plural",unit:"U04",title:"Một và nhiều – danh từ số nhiều",minutes:18,objective:"Biến danh từ số ít thành số nhiều đúng quy tắc.",explain:[{heading:"Quy tắc chính",lines:["Phần lớn danh từ: thêm -s (book → books).","Tận cùng s, x, ch, sh: thêm -es (bus → buses, watch → watches).","Tận cùng phụ âm + y: đổi y → ies (city → cities).","Tận cùng nguyên âm + y: chỉ thêm s (toy → toys)."]},{heading:"Bảng tóm tắt",lines:[],table:[["Tận cùng","Cách làm","Ví dụ"],["Thường","+ s","pen → pens"],["s, x, ch, sh","+ es","box → boxes"],["phụ âm + y","y → ies","baby → babies"],["nguyên âm + y","+ s","boy → boys"]]},{heading:"Từ bất quy tắc cần thuộc",lines:["child → children, man → men, woman → women, foot → feet, tooth → teeth, person → people."]}],examples:[{en:"two books",vi:"hai quyển sách",ok:!0},{en:"three buses",vi:"ba chiếc xe buýt",ok:!0},{en:"five cities",vi:"năm thành phố",ok:!0},{en:"two childs",vi:"hai đứa trẻ",ok:!1,note:"Sai: child → children."},{en:"three citys",vi:"ba thành phố",ok:!1,note:"Sai: phụ âm + y → bỏ y, thêm ies → cities."}],guided:{questionId:"ls-plural-g1",steps:['Chữ cuối của "bus" là s.',"Tận cùng s → thêm -es.","bus + es = buses."]},practice:["ls-plural-p1","ls-plural-p2"],quiz:["ls-plural-q1","ls-plural-q2","ls-plural-q3"],remedial:{simpler:["Bước 1: nhìn chữ cuối của từ.","Bước 2: nếu là s, x, ch, sh → thêm es.","Bước 3: nếu là phụ âm + y → bỏ y, thêm ies.","Còn lại thường chỉ thêm s. Vài từ đặc biệt (child, man…) phải học thuộc."],questionId:"ls-plural-r1"},vocab:[{id:"v-box",en:"box",vi:"cái hộp",example:"There are two boxes."},{id:"v-bus",en:"bus",vi:"xe buýt",example:"I go to school by bus."},{id:"v-city",en:"city",vi:"thành phố",example:"Hanoi is a big city."},{id:"v-child",en:"child",vi:"đứa trẻ",example:"The child is happy."},{id:"v-toy",en:"toy",vi:"đồ chơi",example:"He has many toys."},{id:"v-watch",en:"watch",vi:"đồng hồ đeo tay / xem",example:"I have a new watch."}]},{id:"lesson-article",unit:"U05",title:"A, an hay the?",minutes:18,objective:"Chọn a / an theo âm đầu và biết khi nào dùng the.",explain:[{heading:"a hay an?",lines:["Dùng a trước từ bắt đầu bằng âm phụ âm: a book, a teacher.","Dùng an trước từ bắt đầu bằng âm nguyên âm: an apple, an egg.","Hãy nghe âm đầu chứ không chỉ nhìn chữ: an hour (chữ h không đọc)."]},{heading:"Khi nào dùng the?",lines:["Dùng the khi người nghe đã biết cụ thể là cái nào, hoặc chỉ có một: the moon, the sun.","Nhắc lần đầu dùng a/an; nhắc lại lần hai dùng the: I have a cat. The cat is white."]},{heading:"Lưu ý",lines:["a/an chỉ dùng với danh từ đếm được số ít.",'Với số nhiều, không dùng a/an: books, not "a books".']}],examples:[{en:"an orange",vi:"một quả cam",ok:!0},{en:"a teacher",vi:"một giáo viên",ok:!0},{en:"I have a dog. The dog is big.",vi:"Tôi có một con chó. Con chó ấy to.",ok:!0},{en:"a apple",vi:"một quả táo",ok:!1,note:"Sai: apple bắt đầu bằng âm nguyên âm → an apple."},{en:"an teacher",vi:"một giáo viên",ok:!1,note:"Sai: teacher bắt đầu bằng âm phụ âm → a teacher."}],guided:{questionId:"ls-art-g1",steps:['Đọc to chữ đầu của "orange": âm /ɒ/.',"Đó là âm nguyên âm.","Âm nguyên âm → an."]},practice:["ls-art-p1","ls-art-p2"],quiz:["ls-art-q1","ls-art-q2","ls-art-q3"],remedial:{simpler:["Nhìn chữ đầu của từ ngay sau chỗ trống.","Nếu chữ đó đọc là a, e, i, o, u → dùng an.","Nếu không → dùng a.",'Còn "the" chỉ dùng khi nói về cái đã biết rõ hoặc chỉ có một.'],questionId:"ls-art-r1"},vocab:[{id:"v-egg",en:"egg",vi:"quả trứng",example:"I eat an egg."},{id:"v-orange",en:"orange",vi:"quả cam",example:"She has an orange."},{id:"v-umbrella",en:"umbrella",vi:"cái ô",example:"I have an umbrella."},{id:"v-nurse",en:"nurse",vi:"y tá",example:"My mother is a nurse."},{id:"v-moon",en:"moon",vi:"mặt trăng",example:"The moon is big."},{id:"v-artist",en:"artist",vi:"họa sĩ",example:"She is an artist."}]},{id:"lesson-havehas",unit:"U08",title:"Tôi có… – have và has",minutes:15,objective:"Dùng have / has đúng với chủ ngữ để nói về những gì ai đó có.",explain:[{heading:"have = có",lines:["Em dùng have / has để nói ai đó có cái gì.","I, You, We, They và chủ ngữ số nhiều → have.","He, She, It và chủ ngữ số ít → has."],table:[["Chủ ngữ","Động từ","Ví dụ"],["I / You / We / They","have","They have a car."],["He / She / It","has","She has a cat."],["My parents (nhiều người)","have","My parents have two cars."],["My brother (một người)","has","My brother has a phone."]]},{heading:"Mẹo",lines:["Thay chủ ngữ bằng đại từ (he, she, it, they…) rồi chọn have/has.",'Không nhầm với to be: "is/are" không có nghĩa "có".']}],examples:[{en:"I have two notebooks.",vi:"Tôi có hai quyển vở.",ok:!0},{en:"She has a little sister.",vi:"Bạn ấy có một em gái.",ok:!0},{en:"He have a bike.",vi:"Cậu ấy có một chiếc xe đạp.",ok:!1,note:"Sai: He đi với has → He has a bike."},{en:"They has a house.",vi:"Họ có một ngôi nhà.",ok:!1,note:"Sai: They đi với have → They have a house."}],guided:{questionId:"ls-have-g1",steps:["Tìm chủ ngữ: She.","She thuộc nhóm he/she/it.","He/She/It dùng has."]},practice:["ls-have-p1","ls-have-p2"],quiz:["ls-have-q1","ls-have-q2","ls-have-q3"],remedial:{simpler:["Có 2 từ: have và has.","has chỉ dùng cho một người hoặc một vật (he, she, it).","Còn lại (I, you, we, they, số nhiều) → have.","Thử thay chủ ngữ bằng đại từ để chọn."],questionId:"ls-have-r1"},vocab:[{id:"v-tail",en:"tail",vi:"cái đuôi",example:"The dog has a long tail."},{id:"v-notebook",en:"notebook",vi:"quyển vở",example:"I have two notebooks."},{id:"v-phone",en:"phone",vi:"điện thoại",example:"My brother has a new phone."},{id:"v-sister",en:"sis
